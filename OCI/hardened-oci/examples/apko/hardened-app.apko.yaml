# Declarative hardened image build with apko.
#
# apko assembles an OCI image directly from a package list — no Dockerfile, no
# build-time shell, reproducible, and it emits an SBOM automatically. This is the
# preferred build path in this program.
#
# Build:
#   apko build hardened-app.apko.yaml myapp:latest myapp.tar
#   docker load < myapp.tar
#
# apko writes an SBOM alongside the image (SPDX by default).

contents:
  # Wolfi is the hardened, rolling, fast-patched package repository.
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Minimal runtime only. No shell, no package manager in the result.
    - ca-certificates-bundle
    - tzdata
    # Add ONLY the runtime your app needs, e.g. one of:
    # - openjdk-21-jre
    # - nodejs-20
    # - python-3.12
    # Then COPY/add your application artifact via a melange-built package or the
    # `paths` stanza below.

# Run as a numeric non-root user. 65532 == "nonroot" convention.
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# Entry point for the workload. Point this at your application binary/artifact.
entrypoint:
  command: /usr/bin/myapp

# Only build for the architectures you actually deploy.
archs:
  - x86_64
  - aarch64

# Environment. Keep minimal; inject secrets at runtime, never bake them in.
environment:
  PATH: /usr/sbin:/sbin:/usr/bin:/bin

# Optional: place your application files into the image.
# paths:
#   - path: /usr/bin/myapp
#     type: hardlink
#     source: /work/myapp
#     uid: 65532
#     gid: 65532
#     permissions: 0o755
