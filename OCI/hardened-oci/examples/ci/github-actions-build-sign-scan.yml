# Build → SBOM → scan → sign → attest, as a GitHub Actions workflow.
#
# Implements the secure image lifecycle (docs/02) using keyless cosign signing
# bound to this workflow's OIDC identity — no long-lived signing key.
#
# Adapt: registry name, image path, and the scan/waiver policy to your org.

name: build-sign-scan

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write          # REQUIRED for cosign keyless (OIDC) signing
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}     # e.g. acme/payments-api

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push by digest. Use the hardened multi-stage Dockerfile.
      - name: Build & push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/dockerfile/Dockerfile.hardened-multistage
          target: runtime-distroless
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          provenance: true          # SLSA provenance
          sbom: true                # attach SBOM

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Fail the build on un-waived Critical/High vulnerabilities.
      - name: Scan image (Grype)
        uses: anchore/scan-action@v4
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          # only-fixed: true        # optionally ignore vulns with no fix yet

  sign-attest:
    needs: [build, scan]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image ref
        run: echo "REF=${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ needs.build.outputs.digest }}" >> "$GITHUB_ENV"

      # Keyless signing — identity is THIS workflow, recorded in Rekor.
      - name: Sign image (keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign "$REF"

      - name: Generate SBOM (SPDX)
        run: syft "$REF" -o spdx-json > sbom.spdx.json

      - name: Attest SBOM (keyless)
        env:
          COSIGN_YES: "true"
        run: cosign attest --predicate sbom.spdx.json --type spdxjson "$REF"

      # Downstream / clusters verify with:
      #   cosign verify \
      #     --certificate-identity-regexp 'https://github.com/acme/.+/.github/workflows/.+' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     ghcr.io/acme/payments-api@sha256:...
