# CI: attach SBOM + provenance to an image with ORAS, alongside cosign signing.
# Covers mastery Step 9. Producer-side automation that feeds the whole program.
#
# Assumes the image was already built & pushed by digest (see
# ../../../hardened-oci/examples/ci/github-actions-build-sign-scan.yml).

name: attach-artifacts

on:
  workflow_call:
    inputs:
      image_ref:            # e.g. registry.acme.internal/payments-api@sha256:...
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write           # OIDC: keyless cosign + registry login

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Install oras, syft, cosign
        run: |
          curl -sSfL "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin oras
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign

      - name: Registry login (short-lived token)
        run: oras login registry.acme.internal -u "${{ secrets.REGISTRY_USER }}" --password-stdin <<< "${{ secrets.REGISTRY_TOKEN }}"

      - name: Generate SBOM
        run: syft "${{ inputs.image_ref }}" -o cyclonedx-json > app.cyclonedx.json

      - name: Attach SBOM (ORAS, Referrers API)
        run: |
          oras attach --artifact-type application/vnd.cyclonedx+json \
            "${{ inputs.image_ref }}" \
            app.cyclonedx.json:application/json

      - name: Sign + attest (cosign, keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ inputs.image_ref }}"
          cosign attest --predicate app.cyclonedx.json --type cyclonedx "${{ inputs.image_ref }}"

      - name: Verify evidence is attached
        run: oras discover "${{ inputs.image_ref }}" --format tree

      # The registry now holds the image + SBOM + signature + attestation, all
      # discoverable by digest. The SBOM platform pulls them via pull-and-ingest.sh.
