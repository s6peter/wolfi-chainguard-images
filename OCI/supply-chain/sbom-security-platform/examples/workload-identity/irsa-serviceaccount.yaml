# IRSA: bind a Kubernetes ServiceAccount to an AWS IAM role (docs/06 §3).
# The pod gets short-lived AWS creds via the projected OIDC token — NO static
# keys. The IAM role's permissions should be least-privilege (e.g. only the S3
# prefix for SBOM blobs and the specific KMS key).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: sbom-ingester
  namespace: sbom-platform
  annotations:
    # This annotation is what wires the SA to the IAM role.
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/sbom-ingester-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbom-ingester
  namespace: sbom-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app: sbom-ingester }
  template:
    metadata:
      labels: { app: sbom-ingester }
    spec:
      serviceAccountName: sbom-ingester      # <-- assumes the IAM role
      # Do NOT auto-mount broad tokens; IRSA projects its own scoped token.
      containers:
        - name: ingester
          image: registry.acme.internal/sbom-ingester@sha256:REPLACE_WITH_REAL_DIGEST
          # The AWS SDK auto-discovers creds from the projected token — no keys,
          # no AWS_ACCESS_KEY_ID env var anywhere.
          env:
            - name: AWS_REGION
              value: us-east-1
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
