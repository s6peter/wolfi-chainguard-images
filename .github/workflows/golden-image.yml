# =============================================================================
# Golden image pipeline
#
# Nightly ingest of approved upstream base images into the organisation's
# quarantine mirror, verification, scanning, gating, and promotion to the
# approved/ namespace with an organisation signature and attestations.
#
# Source of truth:
#   hardened-oci/oras-learning-with-project/image-cosign-kms-kyverno-slsa/
#     golden-image-04/
#
# Compliance: PCI-DSS 6.3.1/6.3.2/11.3, HIPAA 164.308(a)(1)(ii)(A) + 164.312(c),
#             HITRUST 09.j/10.m, SOX ITGC change + access, FedRAMP CM-2/RA-5/
#             SI-7/AU-11, NIST SP 800-190 s4.1-4.5, CIS Docker Benchmark s4.
#
# ACTION PINNING: third-party actions below are referenced by tag for
# readability. Before this runs in a regulated environment they MUST be pinned
# to a commit SHA (FedRAMP SR-3 / SLSA source integrity):
#
#   gh api repos/actions/checkout/git/refs/tags/v4 --jq .object.sha
#   # then: actions/checkout@<sha> # v4.2.2
# =============================================================================
name: golden-image

on:
  schedule:
    # 02:00 UTC daily. Ingest runs nightly; consumer bump PRs are batched
    # weekly by Renovate so application teams see one PR, not seven.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      image_key:
        description: 'Single catalogue key to run (blank = all)'
        required: false
        type: string
      dry_run:
        description: 'Run gates but skip promotion'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'hardened-oci/oras-learning-with-project/image-cosign-kms-kyverno-slsa/golden-image-04/**'
      - '.github/workflows/golden-image.yml'

permissions:
  contents: read

concurrency:
  group: golden-image-${{ github.ref }}
  cancel-in-progress: false   # never abort a run mid-promotion

env:
  BASE_DIR: hardened-oci/oras-learning-with-project/image-cosign-kms-kyverno-slsa/golden-image-04
  # Pinned tool versions. The pipeline's own toolchain is part of the trusted
  # computing base, so it is version-controlled like everything else.
  COSIGN_VERSION: v2.4.1
  TRIVY_VERSION: 0.58.1
  SYFT_VERSION: v1.18.1
  ORAS_VERSION: 1.2.2

jobs:
  # ---------------------------------------------------------------------------
  # Read the catalogue and fan out. The catalogue is the authorised-base-image
  # register; a change to it is a reviewed commit, which is the SOX control.
  # ---------------------------------------------------------------------------
  catalogue:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - id: build
        name: Build image matrix from catalogue
        run: |
          set -euo pipefail
          cd "$BASE_DIR"
          jq -e . catalog/images.json > /dev/null

          if [[ -n "${{ inputs.image_key }}" ]]; then
            MATRIX=$(jq -c --arg k "${{ inputs.image_key }}" \
              '[.images[] | select(.key==$k) | {key, tier, upstream}]' catalog/images.json)
          else
            MATRIX=$(jq -c '[.images[] | {key, tier, upstream}]' catalog/images.json)
          fi

          COUNT=$(jq 'length' <<<"$MATRIX")
          [[ "$COUNT" -gt 0 ]] || { echo "::error::no catalogue entries matched"; exit 1; }

          {
            echo "matrix=$MATRIX"
            echo "count=$COUNT"
            echo "sha256=$(sha256sum catalog/images.json | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

          echo "### Golden image run - ${COUNT} image(s)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- `\(.key)` (\(.tier)) <- `\(.upstream)`"' <<<"$MATRIX" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # One job per image. fail-fast is off: one rejected image must not hide the
  # result of the others, and each needs its own evidence record.
  # ---------------------------------------------------------------------------
  golden-image:
    needs: catalogue
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image: ${{ fromJSON(needs.catalogue.outputs.matrix) }}

    permissions:
      contents: read
      packages: write      # push to GHCR mirror/ and approved/
      id-token: write      # keyless cosign signing via OIDC
      issues: write        # raise the page on gate failure

    steps:
      - uses: actions/checkout@v4

      # -- toolchain ---------------------------------------------------------
      - name: Install skopeo and jq
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo jq
          skopeo --version

      - name: Install cosign
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          curl -fsSL -o /tmp/cosign.sha256 \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64.sha256"
          echo "$(cut -d' ' -f1 /tmp/cosign.sha256)  /tmp/cosign" | sha256sum -c -
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          cosign version

      - name: Install trivy, syft, oras
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tgz -C /tmp trivy && sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

          curl -fsSL "https://raw.githubusercontent.com/anchore/syft/main/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "${SYFT_VERSION}"

          curl -fsSL -o /tmp/oras.tgz \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/oras.tgz -C /tmp oras && sudo install -m 0755 /tmp/oras /usr/local/bin/oras

          trivy --version; syft version; oras version

      # -- registry authentication ------------------------------------------
      # GITHUB_TOKEN is scoped to this repository and expires with the job.
      # No long-lived registry credential exists anywhere in this pipeline.
      - name: Authenticate to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

      # -- the pipeline ------------------------------------------------------
      - name: Run golden image pipeline (${{ matrix.image.key }})
        id: pipeline
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          # Keyless: the signing identity IS this workflow. No private key
          # exists to be stolen, and the certificate records which workflow,
          # at which commit, produced the signature. FedRAMP IA-5, SLSA L3.
          #
          # For a KMS-backed organisational key instead, set:
          #   COSIGN_SIGN_MODE: kms
          #   COSIGN_KEY_REF: ${{ secrets.COSIGN_KMS_KEY_REF }}
          #   plus the cloud OIDC role that can call Sign on that key.
          COSIGN_SIGN_MODE: keyless
          COSIGN_EXPERIMENTAL: "1"
          PAGE_WEBHOOK: ${{ secrets.GOLDEN_IMAGE_PAGE_WEBHOOK }}
          EVIDENCE_ROOT: ${{ github.workspace }}/${{ env.BASE_DIR }}/evidence
        run: |
          set -euo pipefail
          cd "$BASE_DIR"
          chmod +x scripts/golden-image.sh

          if [[ "${{ inputs.dry_run }}" == "true" || "${{ github.event_name }}" == "pull_request" ]]; then
            echo "::notice::dry run - gates only, no promotion"
            # A PR must never write to approved/. Run the read-only stages by
            # pointing promotion at a throwaway namespace the cluster ignores.
            export REGISTRY="ghcr.io/${{ github.repository_owner }}/dryrun"
          fi

          ./scripts/golden-image.sh run "${{ matrix.image.key }}"

      # -- evidence ----------------------------------------------------------
      # Runner-local artifacts are a staging copy only. The authoritative
      # record is the ORAS referrer attached to the image plus the WORM
      # export below. SOX 7yr / HIPAA 6yr / PCI 12mo / FedRAMP AU-11 3yr.
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.image.key }}-${{ github.run_id }}
          path: ${{ env.BASE_DIR }}/evidence/${{ matrix.image.key }}/**
          retention-days: 90
          if-no-files-found: warn

      # Replace with your object-lock bucket. Retention must be enforced by the
      # storage layer, not by policy - an operator who can delete evidence
      # breaks the SOX control regardless of what the runbook says.
      # - name: Export evidence to WORM storage
      #   if: always() && github.event_name == 'schedule'
      #   run: |
      #     aws s3 cp --recursive "$BASE_DIR/evidence/${{ matrix.image.key }}" \
      #       "s3://bank-golden-image-evidence/${{ matrix.image.key }}/" \
      #       --expected-size 0 --only-show-errors

      # -- verify what we published -----------------------------------------
      - name: Verify promoted image (consumer view)
        if: success() && inputs.dry_run != true && github.event_name != 'pull_request'
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          COSIGN_SIGN_MODE: keyless
        run: |
          set -euo pipefail
          cd "$BASE_DIR"
          ./scripts/golden-image.sh verify-approved "${{ matrix.image.key }}"

      # -- page --------------------------------------------------------------
      # A failed gate is an operational event, not a red tick nobody reads.
      # The issue is the durable record; the webhook is the interrupt.
      - name: Raise page (gate failure)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          KEY="${{ matrix.image.key }}"
          TITLE="[golden-image] gate failed: ${KEY}"

          EXISTING=$(gh issue list --state open --search "in:title \"${TITLE}\"" \
                       --json number --jq '.[0].number // empty' || true)

          BODY=$(cat <<EOF
          **Image:** \`${KEY}\` (${{ matrix.image.tier }})
          **Upstream:** \`${{ matrix.image.upstream }}\`
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Catalogue sha256:** \`${{ needs.catalogue.outputs.sha256 }}\`

          The image did **not** pass the promotion gate. It remains quarantined in
          \`mirror/\` and was **not** promoted to \`approved/\`. No workload is affected;
          consumers continue to run the previously approved digest.

          ### Required actions
          1. Download the evidence artifact from the run above.
          2. Read \`08-decision.json\` for the specific control violations.
          3. Either wait for an upstream rebuild that clears the finding, or raise a
             documented risk acceptance and amend the threshold in \`catalog/images.json\`
             (which is a **normal change** and needs CAB approval - not a standard change).

          _Patch SLA clock is running: PCI-DSS 6.3.3 critical = 30 days,
          FedRAMP ConMon high = 30 days._
          EOF
          )

          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" \
              --label "security,golden-image,incident" || \
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  # ---------------------------------------------------------------------------
  # Aggregate result. This job is the one to mark as a required status check.
  # ---------------------------------------------------------------------------
  report:
    needs: [catalogue, golden-image]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Summarise
        run: |
          set -euo pipefail
          RESULT="${{ needs.golden-image.result }}"
          {
            echo ""
            echo "## Golden image run complete"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Images | ${{ needs.catalogue.outputs.count }} |"
            echo "| Catalogue sha256 | \`${{ needs.catalogue.outputs.sha256 }}\` |"
            echo "| Result | \`${RESULT}\` |"
            echo "| Run | ${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$RESULT" != "success" ]]; then
            echo "::error::one or more images failed the promotion gate"
            exit 1
          fi
